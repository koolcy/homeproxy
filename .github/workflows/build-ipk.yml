name: Build ipk for HomeProxy

on:
  push:
    branches:
      - 'master'
      - 'dev'
    paths:
      - 'htdocs/**'
      - 'po/**'
      - 'root/**'
      - 'Makefile'
      - '.github/**'

  pull_request:
    branches:
      - 'master'
      - 'dev'
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - 'htdocs/**'
      - 'root/**'
      - 'Makefile'
      - '.github/**'

  release:
    types:
      - published

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source tree
        uses: actions/checkout@v5

      - name: Build ipk file
        env:
          RELEASE_TYPE: ${{ github.event_name }}
        run: |
          set -e

          pushd .github

          echo "===== Build IPK ====="
          fakeroot bash build-ipk.sh

          echo "===== Find generated IPK ====="
          find . -type f -name "*.ipk" -print

          mkdir -p output

          IPK_FILE=$(find . -type f -name "*.ipk" | head -n 1)

          if [ -z "$IPK_FILE" ]; then
            echo "ERROR: No IPK file was generated!"
            exit 1
          fi

          echo "Found IPK: $IPK_FILE"

          cp "$IPK_FILE" output/

          ASSET_NAME=$(basename "$IPK_FILE")
          echo "ASSET_NAME=$ASSET_NAME" >> "$GITHUB_ENV"

          echo "===== Final IPK ====="
          ls -lah output/

          popd

      - name: Publishing to GitHub Artifacts
        if: github.event_name != 'release'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ASSET_NAME }}
          path: .github/output/*.ipk
          if-no-files-found: error

      - name: Publishing to GitHub Releases
        if: github.event_name == 'release'
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ github.token }}
          file: .github/output/*.ipk
          tag: ${{ github.ref }}
          file_glob: true
