name: Build HomeProxy APK

on:
  push:
    branches:
      - master
      - dev
    paths:
      - 'htdocs/**'
      - 'po/**'
      - 'root/**'
      - 'Makefile'
      - '.github/**'

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source tree
        uses: actions/checkout@v5

      - name: Build APK
        env:
          RELEASE_TYPE: ${{ github.event_name }}
        run: |
          set -e

          chmod +x .github/build-apk.sh

          .github/build-apk.sh

      - name: Show APK
        run: |
          echo "===== Generated APK ====="
          find .github/output \
            -type f \
            -name "*.apk" \
            -print

          ls -lah .github/output/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: homeproxy-apk
          path: .github/output/*.apk
          if-no-files-found: error
