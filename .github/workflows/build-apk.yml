name: Build HomeProxy APK

on:
  workflow_dispatch:

  push:
    branches:
      - master
      - dev
    paths:
      - 'htdocs/**'
      - 'po/**'
      - 'root/**'
      - 'Makefile'
      - '.github/**'

  release:
    types:
      - published

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:

      - name: Checkout source tree
        uses: actions/checkout@v5

      - name: Install build dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            gawk \
            gettext \
            gcc-multilib \
            g++-multilib \
            libncurses-dev \
            libssl-dev \
            python3 \
            python3-distutils \
            rsync \
            unzip \
            zlib1g-dev \
            file \
            wget \
            curl \
            git \
            fakeroot \
            zstd \
            perl

      - name: Build HomeProxy + sing-box
        run: |
          set -e

          chmod +x .github/build-apk.sh

          .github/build-apk.sh

      - name: Show APK
        run: |
          echo "========================================"
          echo "Generated APK"
          echo "========================================"

          find .github/output \
            -type f \
            -name "*.apk" \
            -print

          ls -lah .github/output/

      - name: Upload GitHub Artifact
        if: github.event_name != 'release'
        uses: actions/upload-artifact@v4
        with:
          name: homeproxy-apk
          path: .github/output/*.apk
          if-no-files-found: error

      - name: Upload APK to GitHub Release
        if: github.event_name == 'release'
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ github.token }}
          file: .github/output/*.apk
          tag: ${{ github.event.release.tag_name }}
          file_glob: true
          overwrite: true
